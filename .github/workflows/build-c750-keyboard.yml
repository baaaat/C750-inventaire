name: Construire C750 BLE Keyboard

on:
  workflow_dispatch:
  push:
    paths:
      - "C750_BLE_Keyboard.zip"
      - ".github/workflows/build-c750-keyboard.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decompresser le projet
        run: |
          rm -rf build-c750
          mkdir build-c750
          unzip -o C750_BLE_Keyboard.zip -d build-c750
          PROJECT_DIR=$(find build-c750 -name settings.gradle -type f -printf '%h\n' | head -1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compiler APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: C750-BLE-Keyboard-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
